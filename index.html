<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator Ultra</title>
<meta name="description" content="Colourful calculators: everyday, scientific, discount, percentage, loans, units, land and gold.">
<meta name="theme-color" content="#e6f1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc Ultra">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: a masonry dashboard of colour cards that open into full-screen calculators.
   Tokens below are the fallback (Sky / Midnight); the app's own theme picker overrides them at runtime. */
:root {
  --bg: #e6f1ff; --bg-img: none; --surface: #ffffff; --surface-2: #d3e6fc; --fg: #10294a; --muted: #5b7393;
  --line: rgba(16, 41, 74, .1); --accent: #1f7ae0; --key: #ffffff; --key-fg: #10294a; --op: #ff8a3d; --op-fg: #ffffff;
  --eq: #1f7ae0; --eq-fg: #ffffff; --fn: #d3e6fc; --fn-fg: #10294a; --sheet: #ffffff; --field: #e6f1ff;
  --good: #12855a; --bad: #c9302c;
  --f-display: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "Outfit", "Poppins", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1020; --surface: #141d33; --surface-2: #1c2742; --fg: #e6ecf8; --muted: #8b98b4; --line: rgba(255,255,255,.1);
    --accent: #6aa8ff; --key: #141d33; --key-fg: #e6ecf8; --op: #22305a; --op-fg: #9cc4ff; --eq: #3b82f6; --eq-fg: #ffffff;
    --fn: #1c2742; --fn-fg: #e6ecf8; --sheet: #141d33; --field: #1c2742; --good: #5be49b; --bad: #ff8a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1020; --surface: #141d33; --surface-2: #1c2742; --fg: #e6ecf8; --muted: #8b98b4; --line: rgba(255,255,255,.1);
  --accent: #6aa8ff; --key: #141d33; --key-fg: #e6ecf8; --op: #22305a; --op-fg: #9cc4ff; --eq: #3b82f6; --eq-fg: #ffffff;
  --fn: #1c2742; --fn-fg: #e6ecf8; --sheet: #141d33; --field: #1c2742; --good: #5be49b; --bad: #ff8a7a; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100%; margin: 0; background: var(--bg); color: var(--fg);
  font: 500 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent;
}
body.in-calc { overflow: hidden; }
.backdrop { position: fixed; inset: 0; z-index: -1; background: var(--bg); background-image: var(--bg-img); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Dashboard ---------- */
#home {
  max-width: 1000px; margin: 0 auto; padding-block: 14px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 16px; }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.brand h1 { font: 800 27px/1 var(--f-display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.brand p { margin: 5px 0 0; color: var(--muted); font-size: 13px; font-weight: 600; }
.logo { width: 42px; height: 42px; flex: none; }
.top-actions { display: flex; gap: 8px; flex: none; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); flex: none;
}
.pill-btn {
  height: 42px; padding: 0 15px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  font-weight: 800; display: inline-flex; gap: 6px; align-items: center; font-size: 14px;
}
.pill-btn.on { background: var(--eq); color: var(--eq-fg); border-color: transparent; }
.tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
@media (min-width: 640px) { .tools { flex-direction: row; } .tools .search { flex: 1; } .tools .seg { flex: 0 0 340px; } }
.search {
  display: flex; align-items: center; gap: 8px; height: 46px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 15px; padding: 0 12px; color: var(--muted);
}
.search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; min-width: 0; color: var(--fg); font-weight: 600; }
.search input::placeholder { color: var(--muted); }

.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 3px; gap: 2px; }
.seg button {
  flex: 1; min-height: 36px; border-radius: 12px; font-weight: 800; font-size: 13px; color: var(--muted);
  white-space: nowrap; padding: 0 10px;
}
.seg button.on { background: var(--eq); color: var(--eq-fg); }

.edit-bar {
  display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 10px 10px 10px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 600;
}
.edit-bar span { flex: 1; color: var(--muted); }

#grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 54px;
  grid-auto-flow: row dense; gap: 12px;
}
@media (min-width: 640px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 920px) { #grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cat-h {
  grid-column: 1 / -1; align-self: end; margin: 0; padding: 0 2px 2px;
  font: 800 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.card {
  position: relative; border-radius: 22px; overflow: hidden; color: #fff; isolation: isolate;
  background: linear-gradient(145deg, var(--c1), var(--c2)); padding: 14px;
  display: flex; flex-direction: column; gap: 5px; box-shadow: 0 10px 22px -14px var(--c2);
  transition: transform .15s ease;
}
.card:active { transform: scale(.98); }
.sz-s { grid-row: span 2; }
.sz-m { grid-row: span 3; }
.sz-l { grid-column: span 2; grid-row: span 3; }
.card-hit { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.cicon { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
.cname { font: 800 17px/1.15 var(--f-display); letter-spacing: -.01em; margin-top: auto; text-shadow: 0 1px 2px rgba(0,0,0,.15); }
.sz-l .cname { font-size: 22px; }
.cdesc { font-size: 12.5px; line-height: 1.35; font-weight: 600; opacity: .94; max-width: 34ch; }
.cglyph {
  position: absolute; right: -4px; bottom: -16px; z-index: -1; pointer-events: none;
  font: 800 80px/1 var(--f-display); letter-spacing: -.05em; opacity: .17; white-space: nowrap;
}
.sz-l .cglyph { font-size: 110px; bottom: -22px; right: 6px; }
.ctag {
  position: absolute; top: 14px; right: 14px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; background: rgba(255,255,255,.22); padding: 5px 9px; border-radius: 999px;
}
.cedit { position: absolute; z-index: 2; top: 8px; left: 8px; right: 8px; display: flex; gap: 5px; justify-content: space-between; }
.cedit button {
  height: 32px; min-width: 32px; padding: 0 6px; border-radius: 10px; background: rgba(0,0,0,.3); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 12px;
}
.cedit svg.i { width: 17px; height: 17px; }
.editing .card { outline: 2px dashed rgba(255,255,255,.75); outline-offset: -6px; }
.editing .cicon, .editing .ctag { visibility: hidden; }
.empty { grid-column: 1 / -1; grid-row: span 2; display: grid; place-items: center; color: var(--muted); font-weight: 700; text-align: center; }

.hidden-wrap { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.hidden-wrap h2 { font: 800 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.hrow { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 12px; }
.hrow .dot { width: 14px; height: 14px; border-radius: 5px; background: linear-gradient(145deg, var(--c1), var(--c2)); flex: none; }
.hrow span { flex: 1; font-weight: 700; }
.foot-actions { margin-top: 18px; display: flex; justify-content: center; }

/* ---------- Calculator view ---------- */
#calcView {
  position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
  background: var(--bg); background-image: var(--bg-img);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cwrap { width: 100%; max-width: 680px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cbar { display: flex; align-items: center; gap: 10px; height: 58px; flex: none; }
.cbar h2 {
  font: 800 21px/1.1 var(--f-display); letter-spacing: -.015em; margin: 0; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 9px;
}
.cdot { width: 13px; height: 13px; border-radius: 4px; background: linear-gradient(145deg, var(--c1), var(--c2)); flex: none; }
.cbar-actions { display: flex; gap: 8px; }
.badge-btn { position: relative; }
.badge-btn b {
  position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
  background: var(--eq); color: var(--eq-fg); font-size: 11px; display: grid; place-items: center;
}
#calcBody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#calcBody.fixed { overflow: hidden; }

.abar {
  flex: none; margin-bottom: 10px; border-radius: 20px; padding: 12px 12px 12px 16px; color: #fff;
  background: linear-gradient(140deg, var(--c1), var(--c2)); display: flex; align-items: center; gap: 10px;
  box-shadow: 0 10px 22px -16px var(--c2);
}
.abar > div { flex: 1; min-width: 0; }
.abar .al { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.abar .av { font: 700 30px/1.1 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -.02em; }
.abar .as { font-size: 13px; font-weight: 600; opacity: .92; }
.abar .cp { background: rgba(255,255,255,.22); color: #fff; width: 40px; height: 40px; }

/* keypad calculators */
.calc { height: 100%; display: flex; flex-direction: column; gap: 10px; }
.screen {
  flex: 1; min-height: 140px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
  padding: 10px 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: hidden;
}
.tape { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
.tape > :first-child { margin-top: auto; }
.tline {
  font-family: var(--f-num); text-align: right; color: var(--muted); font-size: 15px; font-weight: 600; padding: 3px 2px; border-radius: 8px;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; width: 100%;
}
.tline b { color: var(--fg); font-weight: 800; }
.tline:active { background: var(--surface-2); }
.edit-chip {
  align-self: flex-end; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800;
  background: var(--eq); color: var(--eq-fg); border-radius: 999px; padding: 4px 4px 4px 11px; margin-top: 4px;
}
.edit-chip button { background: rgba(255,255,255,.25); border-radius: 999px; padding: 3px 9px; font-weight: 800; }
.expr {
  width: 100%; border: 0; background: transparent; resize: none; text-align: right; flex: none;
  font: 600 46px/1.16 var(--f-num); letter-spacing: -.01em; color: var(--fg); padding: 2px 0; margin: 0;
  outline: none; overflow: hidden; caret-color: var(--accent); font-variant-numeric: tabular-nums;
  -webkit-user-select: text; user-select: text;
}
.expr::placeholder { color: var(--muted); opacity: .6; }
.preview { font-family: var(--f-num); text-align: right; min-height: 26px; font-size: 21px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.preview.err { color: var(--bad); font-size: 15px; }
.screen-bar { display: flex; gap: 6px; align-items: center; padding-top: 4px; }
.flags { flex: 1; display: flex; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--accent); }
.mini {
  height: 32px; padding: 0 11px; border-radius: 11px; background: var(--surface-2); font-size: 12.5px; font-weight: 800;
  display: inline-flex; align-items: center; gap: 5px;
}
.mini svg.i { width: 15px; height: 15px; }

.pills { display: flex; gap: 6px; overflow-x: auto; flex: none; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  height: 32px; padding: 0 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-weight: 800; font-size: 12px; letter-spacing: .05em; white-space: nowrap; flex: none;
}
.pill.on { background: var(--eq); color: var(--eq-fg); border-color: transparent; }

.keys { display: grid; gap: 8px; flex: none; }
.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
.key {
  height: clamp(50px, 8.4vh, 76px); border-radius: 21px; background: var(--key); color: var(--key-fg);
  font: 600 27px/1 var(--f-num); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px var(--line); transition: transform .07s, filter .07s;
  -webkit-user-select: none; user-select: none; min-width: 0;
}
.key:active { transform: scale(.94); filter: brightness(.9); }
.key.op { background: var(--op); color: var(--op-fg); font-size: 31px; box-shadow: none; }
.key.eq { background: var(--eq); color: var(--eq-fg); font-size: 32px; box-shadow: none; }
.key.fn { background: var(--fn); color: var(--fn-fg); font-size: 21px; box-shadow: none; }
.key.ac { color: var(--bad); }
.key.on { box-shadow: inset 0 0 0 2.5px var(--accent); }
.key small { font-size: 10px; font-weight: 800; opacity: .62; line-height: 1; letter-spacing: .02em; }
.is-sci .key { height: clamp(40px, 6.1vh, 58px); border-radius: 16px; font-size: 22px; }
.is-sci .key.fn { font-size: 16px; }
.is-sci .key.op, .is-sci .key.eq { font-size: 26px; }
.is-sci .expr { font-size: 38px; }

/* form calculators */
.form { display: flex; flex-direction: column; gap: 12px; padding-bottom: 28px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font: 800 12px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; }
.row2 .seg button { min-height: 44px; }
.row3 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fl { font-size: 13px; font-weight: 700; color: var(--muted); }
.fi {
  display: flex; align-items: center; background: var(--field); border: 1.5px solid var(--line); border-radius: 14px;
  height: 52px; padding: 0 12px; gap: 6px; min-width: 0;
}
.fi:focus-within { border-color: var(--accent); }
.fi input, .fi select {
  flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none; font-size: 19px; font-weight: 800;
  height: 100%; font-variant-numeric: tabular-nums; color: var(--fg); padding: 0;
}
.fi input[inputmode="decimal"] { font-family: var(--f-num); font-weight: 600; }
.fi select { appearance: none; -webkit-appearance: none; font-size: 16px; font-weight: 700; }
.fi input[type="date"] { font-size: 16px; font-weight: 700; min-height: 48px; }
.fi.sel::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); flex: none; }
.aff { font-weight: 800; color: var(--muted); font-size: 15px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -2px -14px 0; padding: 0 14px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; height: 34px; padding: 0 13px; border-radius: 999px; background: var(--surface-2); font-weight: 800; font-size: 13px; }
.chips button.on { background: var(--eq); color: var(--eq-fg); }
.swap { width: 44px; height: 52px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; }
.ires { display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 16px; padding: 10px 10px 10px 14px; }
.ires > div { flex: 1; min-width: 0; }
.il { font-size: 12px; font-weight: 700; color: var(--muted); }
.iv { font: 700 24px/1.15 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.res { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.res:first-child { border-top: 0; padding-top: 0; }
.rl { flex: 1; color: var(--muted); font-weight: 700; font-size: 14px; }
.rv { font-family: var(--f-num); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.cp { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); flex: none; color: var(--fg); }
.cp svg.i { width: 16px; height: 16px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0; font-weight: 600; }
.split { height: 14px; border-radius: 999px; overflow: hidden; display: flex; background: var(--surface-2); }
.split i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 6px 4px; }
.tbl td { font-family: var(--f-num); text-align: right; padding: 8px 4px; border-top: 1px solid var(--line); font-weight: 700; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.ulist { display: flex; flex-direction: column; }
.urow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.urow:first-child { border-top: 0; }
.urow span { color: var(--muted); font-weight: 700; font-size: 14px; }
.urow b { font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; font-size: 16px; }
.urow.on span, .urow.on b { color: var(--accent); }
.rates { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.rates .fi { height: 46px; }
.rates .fi input { font-size: 16px; }
.btn {
  min-height: 38px; padding: 0 13px; border-radius: 12px; background: var(--surface-2); font-weight: 800; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg);
}
.btn.pri { background: var(--eq); color: var(--eq-fg); }
.btn.danger { color: var(--bad); }
.btn svg.i { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Sheet, toast ---------- */
#sheet { position: fixed; inset: 0; z-index: 30; }
.scrim { position: absolute; inset: 0; background: rgba(4, 8, 22, .5); animation: fade .2s ease-out; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; max-width: 640px; margin: 0 auto;
  background: var(--sheet); color: var(--fg); border-radius: 26px 26px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .24s cubic-bezier(.2,.8,.3,1);
  box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35);
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 16px 8px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.sheet-head h3 { margin: 0; font: 800 21px/1.1 var(--f-display); letter-spacing: -.01em; }
.sheet-body {
  overflow: auto; -webkit-overflow-scrolling: touch; padding-block: 4px 22px; display: flex; flex-direction: column; gap: 16px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.sheet-body h4 { margin: 0 0 8px; font: 800 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tsw { border-radius: 18px; padding: 6px 6px 8px; border: 2px solid transparent; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.tsw.on { border-color: var(--accent); }
.tprev { height: 66px; border-radius: 13px; display: flex; align-items: flex-end; gap: 5px; padding: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.tprev i { width: 15px; height: 15px; border-radius: 6px; display: block; box-shadow: 0 0 0 1.5px rgba(255,255,255,.5); }
.tname { font-size: 12.5px; font-weight: 800; padding-left: 4px; }
.tsw.auto { flex-direction: row; align-items: center; gap: 12px; }
.tsw.auto .tprev { width: 66px; height: 46px; flex: none; }
.cgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cgrid button { aspect-ratio: 1; border-radius: 12px; background: linear-gradient(145deg, var(--c1), var(--c2)); max-width: 100%; }
.cgrid button.on { box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px var(--accent); }
.hitem { border-top: 1px solid var(--line); }
.hitem:first-child { border-top: 0; }
.hmain { width: 100%; text-align: right; padding: 12px 2px; display: flex; flex-direction: column; gap: 2px; }
.he { font-family: var(--f-num); color: var(--muted); font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.hr { font: 700 24px/1.15 var(--f-num); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ht { font-size: 11px; color: var(--muted); font-weight: 700; }
.hacts { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 12px; justify-content: flex-end; }
.hempty { text-align: center; color: var(--muted); font-weight: 700; padding: 30px 0; }

#toast {
  position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; max-width: calc(100% - 40px);
  background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-weight: 800; font-size: 14px;
  transition: opacity .2s, transform .2s; text-align: center; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* font picker */
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fopt { border-radius: 16px; padding: 10px 12px; background: var(--surface-2); border: 2px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fopt.on { border-color: var(--accent); }
.fopt .fa { font-size: 22px; font-weight: 700; line-height: 1.2; }
.fopt .fn { font-size: 12px; font-weight: 700; color: var(--muted); }
.fopt .fd { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: .01em; overflow-wrap: anywhere; }
.fopt .rec { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nlist { display: flex; flex-direction: column; gap: 8px; }
.rrow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.rrow:first-child { border-top: 0; padding-top: 0; }
.rrow .rn { font-weight: 800; font-size: 14px; }
.rrow .rn small { color: var(--muted); font-weight: 600; }

/* note split + text mode + floating */
.notes { display: none; }
.calc.with-note .notes {
  flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 8px 10px 10px;
}
.calc.with-note .tape { display: none; }
.calc.with-note .screen { flex: 0 0 auto; min-height: 0; padding-top: 8px; border-radius: 20px; }
.calc.with-note .keys { gap: 6px; }
.calc.with-note .key { height: clamp(36px, 5.4vh, 48px); font-size: 22px; border-radius: 15px; }
.calc.with-note .key.op, .calc.with-note .key.eq { font-size: 25px; }
.calc.with-note.is-sci .key { height: clamp(28px, 4.1vh, 38px); font-size: 16px; border-radius: 12px; }
.calc.with-note.is-sci .key.fn { font-size: 13px; }
.calc.with-note.is-sci .key small { display: none; }
.calc.with-note .preview { min-height: 20px; font-size: 17px; }
.nbar { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; flex: none; }
.nbar::-webkit-scrollbar { display: none; }
.nbar strong { flex: 1; font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-left: 4px; }
.nbar .mini { flex: none; }
.notes textarea {
  flex: 1; min-height: 0; width: 100%; border: 0; background: var(--field); border-radius: 14px; padding: 10px 12px;
  resize: none; font: 500 16px/1.5 var(--f-body); color: var(--fg); outline: none;
}
.notes textarea::placeholder { color: var(--muted); }
.mini.on, .icon-btn.pill-on { background: var(--eq); color: var(--eq-fg); border-color: transparent; }
.float-note { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; color: var(--muted); font-weight: 700; }
.float-note p { max-width: 32ch; margin: 0; }

<script>
/* Prism Calc — expression engine (basic + scientific) */
const Calc = (() => {
  class CalcErr extends Error {}
  const FN = ['sinh⁻¹', 'cosh⁻¹', 'tanh⁻¹', 'sin⁻¹', 'cos⁻¹', 'tan⁻¹', 'sinh', 'cosh', 'tanh',
    'sin', 'cos', 'tan', 'log₂', 'log', 'ln', 'abs', '√', '∛'];
  const WORDS = [...FN.map(n => [n, 'fn']), ['Ans', 'const'], ['rand', 'const'], ['mod', 'mod'], ['π', 'const'], ['e', 'const']]
    .sort((a, b) => b[0].length - a[0].length);

  function normalize(s) {
    return String(s)
      .replace(/[×✕xX*·]/g, '*')
      .replace(/[÷/]/g, '/')
      .replace(/[−–—]/g, '-')
      .replace(/[,\s]/g, '');
  }

  function tokenize(src) {
    const s = normalize(src), out = [];
    let i = 0;
    outer: while (i < s.length) {
      const c = s[i];
      if (/[0-9.]/.test(c)) {
        const m = /^(?:\d+\.?\d*|\.\d+)(?:E[+-]?\d+)?/.exec(s.slice(i));
        if (!m) throw new CalcErr('Incomplete number');
        if (s[i + m[0].length] === '.') throw new CalcErr('Too many decimal points');
        out.push({ t: 'num', v: parseFloat(m[0]) });
        i += m[0].length;
        continue;
      }
      for (const [w, t] of WORDS) {
        if (s.startsWith(w, i)) {
          out.push(t === 'fn' ? { t: 'fn', v: w } : t === 'mod' ? { t: 'mod' } : { t: 'const', v: w });
          i += w.length;
          continue outer;
        }
      }
      if ('+-*/^'.includes(c)) { out.push({ t: 'op', v: c }); i++; continue; }
      if (c === '(' || c === ')') { out.push({ t: c }); i++; continue; }
      if (c === '⁻' && s[i + 1] === '¹') { out.push({ t: 'post', v: 'inv' }); i += 2; continue; }
      if ('!%²³'.includes(c)) { out.push({ t: 'post', v: c }); i++; continue; }
      if (c === 'P' || c === 'C') { out.push({ t: c }); i++; continue; }
      if (c === 'E') throw new CalcErr('Incomplete number');
      throw new CalcErr(`Can't read “${c}”`);
    }
    return out;
  }

  const fact = n => {
    if (n < 0 || !Number.isInteger(n)) throw new CalcErr('n! needs a whole number, 0 or more');
    if (n > 170) throw new CalcErr('Number too large for n!');
    let r = 1; for (let k = 2; k <= n; k++) r *= k; return r;
  };
  const checkNR = (n, r) => {
    if (!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0) throw new CalcErr('nCr and nPr need whole numbers');
    if (r > n) throw new CalcErr('r must not be bigger than n');
  };
  const nPr = (n, r) => { checkNR(n, r); let v = 1; for (let k = 0; k < r; k++) v *= (n - k); return v; };
  const nCr = (n, r) => { checkNR(n, r); r = Math.min(r, n - r); let v = 1; for (let k = 1; k <= r; k++) v = v * (n - r + k) / k; return Math.round(v); };
  const pow = (b, e) => {
    if (b < 0 && !Number.isInteger(e)) {
      const inv = 1 / e;
      if (Math.abs(inv - Math.round(inv)) < 1e-9 && Math.round(inv) % 2 !== 0) return -Math.pow(-b, e);
    }
    return Math.pow(b, e);
  };

  function fnv(n, a, deg) {
    const R = x => deg ? x * Math.PI / 180 : x, D = x => deg ? x * 180 / Math.PI : x;
    const z = x => Math.abs(x) < 1e-12 ? 0 : x;
    switch (n) {
      case 'sin': return z(Math.sin(R(a)));
      case 'cos': return z(Math.cos(R(a)));
      case 'tan': {
        if (Math.abs(Math.cos(R(a))) < 1e-12) throw new CalcErr('tan is undefined at this angle');
        return z(Math.tan(R(a)));
      }
      case 'sin⁻¹': if (a < -1 || a > 1) throw new CalcErr('sin⁻¹ needs a value from −1 to 1'); return D(Math.asin(a));
      case 'cos⁻¹': if (a < -1 || a > 1) throw new CalcErr('cos⁻¹ needs a value from −1 to 1'); return D(Math.acos(a));
      case 'tan⁻¹': return D(Math.atan(a));
      case 'sinh': return Math.sinh(a);
      case 'cosh': return Math.cosh(a);
      case 'tanh': return Math.tanh(a);
      case 'sinh⁻¹': return Math.asinh(a);
      case 'cosh⁻¹': if (a < 1) throw new CalcErr('cosh⁻¹ needs a value of 1 or more'); return Math.acosh(a);
      case 'tanh⁻¹': if (a <= -1 || a >= 1) throw new CalcErr('tanh⁻¹ needs a value between −1 and 1'); return Math.atanh(a);
      case 'log': if (a <= 0) throw new CalcErr('log needs a number above 0'); return Math.log10(a);
      case 'log₂': if (a <= 0) throw new CalcErr('log₂ needs a number above 0'); return Math.log2(a);
      case 'ln': if (a <= 0) throw new CalcErr('ln needs a number above 0'); return Math.log(a);
      case 'abs': return Math.abs(a);
      case '√': if (a < 0) throw new CalcErr("Can't take √ of a negative number"); return Math.sqrt(a);
      case '∛': return Math.cbrt(a);
    }
    throw new CalcErr('Unknown function');
  }

  function evaluate(src, opt = {}) {
    const deg = opt.deg !== false;
    const toks = tokenize(src);
    if (!toks.length) throw new CalcErr('Empty');
    let depth = 0;
    for (const k of toks) {
      if (k.t === '(') depth++;
      else if (k.t === ')') { depth--; if (depth < 0) throw new CalcErr('Too many closing brackets'); }
    }
    while (depth-- > 0) toks.push({ t: ')' });

    let p = 0;
    const peek = () => toks[p], next = () => toks[p++];
    const starts = k => k && (k.t === 'num' || k.t === 'const' || k.t === '(' || k.t === 'fn');

    function expr() {
      let L = term().v;
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
        const o = next().v, R = term();
        const add = R.pct != null ? L * R.pct / 100 : R.v;
        L = o === '+' ? L + add : L - add;
      }
      return L;
    }
    function term() {
      const a = unary();
      let v = a.v, pct = a.pct;
      for (;;) {
        const k = peek();
        if (!k) break;
        if (k.t === 'op' && (k.v === '*' || k.v === '/')) {
          next();
          const b = unary();
          if (k.v === '/' && b.v === 0) throw new CalcErr("Can't divide by zero");
          v = k.v === '*' ? v * b.v : v / b.v; pct = null;
        } else if (k.t === 'mod') {
          next(); const b = unary();
          if (b.v === 0) throw new CalcErr("Can't divide by zero");
          v = ((v % b.v) + b.v) % b.v; pct = null;
        } else if (k.t === 'P' || k.t === 'C') {
          next(); const b = unary();
          v = k.t === 'P' ? nPr(v, b.v) : nCr(v, b.v); pct = null;
        } else if (starts(k)) {
          v = v * power().v; pct = null;
        } else break;
      }
      return { v, pct };
    }
    function unary() {
      const k = peek();
      if (k && k.t === 'op' && (k.v === '-' || k.v === '+')) {
        next();
        const r = unary();
        return k.v === '-' ? { v: -r.v, pct: r.pct != null ? -r.pct : null } : r;
      }
      return power();
    }
    function power() {
      const b = postfix();
      if (peek() && peek().t === 'op' && peek().v === '^') {
        next();
        const e = unary();
        return { v: pow(b.v, e.v), pct: null };
      }
      return b;
    }
    function postfix() {
      let v = primary(), pct = null;
      while (peek() && peek().t === 'post') {
        const o = next().v;
        if (o === '%') { pct = v; v = v / 100; continue; }
        pct = null;
        if (o === '!') v = fact(v);
        else if (o === '²') v = v * v;
        else if (o === '³') v = v * v * v;
        else if (o === 'inv') { if (v === 0) throw new CalcErr("Can't divide by zero"); v = 1 / v; }
      }
      return { v, pct };
    }
    function paren() {
      const v = expr();
      const k = next();
      if (!k || k.t !== ')') throw new CalcErr('Check the brackets');
      return v;
    }
    function primary() {
      const k = next();
      if (!k) throw new CalcErr('Incomplete');
      if (k.t === 'num') return k.v;
      if (k.t === 'const') {
        if (k.v === 'π') return Math.PI;
        if (k.v === 'e') return Math.E;
        if (k.v === 'Ans') return opt.ans || 0;
        if (k.v === 'rand') return Math.random();
      }
      if (k.t === '(') return paren();
      if (k.t === 'fn') {
        let a;
        if (peek() && peek().t === '(') { next(); a = paren(); }
        else a = postfix().v;
        return fnv(k.v, a, deg);
      }
      throw new CalcErr('Incomplete');
    }

    const r0 = expr();
    if (p < toks.length) throw new CalcErr('Check the expression');
    if (Number.isNaN(r0)) throw new CalcErr('Not a real number');
    if (!Number.isFinite(r0)) throw new CalcErr('Too large to show');
    let r = +r0.toPrecision(12);
    if (Object.is(r, -0)) r = 0;
    return r;
  }

  // Words typed as labels ("Apple 450 + Egg 90") are kept on screen but ignored in the maths.
  const LABEL_RE = /\p{L}[\p{L}'’.&]*(?:[-\s]+\p{L}[\p{L}'’.&]*)*/gu;
  const stripLabels = s => {
    const t = String(s).replace(LABEL_RE, ' ').replace(/:/g, ' ');
    if (/[\d.)%]\s+[\d.(]/.test(t)) throw new CalcErr('Put + − × or ÷ between the items');
    return t;
  };
  return { evaluate, tokenize, stripLabels, LABEL_RE, CalcErr };
})();
if (typeof module !== 'undefined') module.exports = Calc;

</script>

      <button type="button" class="pill ${st.hyp ? 'on' : ''}" data-p="hyp">HYP</button>
      <button type="button" class="pill" data-p="mc">MC</button>
      <button type="button" class="pill" data-p="mr">MR</button>
      <button type="button" class="pill" data-p="m+">M+</button>
      <button type="button" class="pill" data-p="m-">M−</button>`;
  }
  function drawFlags() {
    const f = [];
    if (sci) f.push(S.angle === 'deg' ? 'DEG' : 'RAD');
    if (st.second) f.push('2ND');
    if (st.hyp) f.push('HYP');
    if (sci && S.mem) f.push('M');
    $('#flags', body).textContent = f.join(' · ');
    const b = histBtn.querySelector('b');
    b.hidden = !H.length; b.textContent = H.length > 99 ? '99+' : H.length;
  }
  function drawTape() {
    const cut = (S.tapeCut || {})[cid] || 0;
    const last = H.filter(h => h.t > cut).slice(-4);
    $('#tape', body).innerHTML = last.map(h => `<button type="button" class="tline" data-id="${h.id}" aria-label="Edit ${esc(h.e)}">${esc(h.e)} = <b>${fmtCalc(h.r)}</b></button>`).join('');
    const t = $('#tape', body); t.scrollTop = t.scrollHeight;
    drawFlags();
  }
  function fit() {
    const n = ta.value.length, big = calcEl.classList.contains('with-note') ? (sci ? 28 : 34) : sci ? 38 : 46;
    const size = n <= 9 ? big : n <= 14 ? big * .78 : n <= 20 ? big * .64 : big * .54;
    ta.style.fontSize = size + 'px';
    ta.style.height = 'auto';
    const max = Math.round(size * 1.16 * 3 + 4);
    ta.style.height = Math.min(ta.scrollHeight, max) + 'px';
    ta.style.overflowY = ta.scrollHeight > max ? 'auto' : 'hidden';
  }
  function preview() {
    const v = ta.value;
    pv.classList.remove('err');
    if (!v || st.just) { pv.textContent = ''; return; }
    if (!/[+−×÷^%!²³⁻(]|mod|[a-zA-Zπ√∛]/.test(v.replace(/^−/, ''))) { pv.textContent = ''; return; }
    try { pv.textContent = '= ' + fmtCalc(evalStr(v)); } catch (e) { pv.textContent = ''; }
  }
  const caret = () => {
    const c = ta.ownerDocument.activeElement === ta ? ta.selectionStart : st.caret;
    return c == null ? ta.value.length : Math.max(0, Math.min(c, ta.value.length));
  };
  function setVal(v, c) {
    ta.value = v;
    st.caret = c == null ? v.length : c;
    try { ta.setSelectionRange(st.caret, st.caret); } catch (e) { }
    fit(); preview();
  }
  function insert(txt) {
    let v = ta.value, c = caret();
    if (st.just) {
      st.just = false;
      if (STARTERS.test(txt)) { v = ''; c = 0; } else c = v.length;
    }
    let prev = v.slice(0, c);
    const next = v.slice(c), last = prev.slice(-1);
    if (txt.length === 1 && BIN.includes(txt)) {
      if (prev === '' && txt !== '−') { if (!H.length) return; prev = rawCalc(ans()).replace(/-/g, '−'); }
      else if (BIN.includes(last)) { if (!(txt === '−' && '×÷^'.includes(last))) prev = prev.slice(0, -1); }
      else if (last === '(' && txt !== '−') return;
    } else if (txt === '.') {
      const m = /[\d.]*$/.exec(prev)[0];
      if (m.includes('.')) return;
      if (m === '') txt = '0.';
    } else if (txt === 'E') {
      if (/E[\d−]*$/.test(prev)) return;
      if (!/\d$/.test(prev)) txt = '1E';
    } else if (/^[%!²³]$|^⁻¹$/.test(txt)) {
      if (prev === '' || BIN.includes(last) || last === '(') return;
    } else if (txt === ')') {
      const o = (prev.match(/\(/g) || []).length, cl = (prev.match(/\)/g) || []).length;
      if (o <= cl || last === '(') return;
    } else if (/^\d$/.test(txt) && /(^|[^\d.E])0$/.test(prev)) {
      prev = prev.slice(0, -1);
    }
    if (labels && /^[\d.(]/.test(txt) && /\p{L}$/u.test(prev)) txt = ' ' + txt;
    setVal(prev + txt + next, prev.length + txt.length);
  }
  function insertNumber(n) {
    let s = rawCalc(n).replace(/-/g, '−');
    if (st.just) { setVal(s); st.just = false; return; }
    const c = caret(), prev = ta.value.slice(0, c);
    if (s.startsWith('−') && prev && !/[(]$/.test(prev)) s = `(${s})`;
    if (/[\d.)πe!%²³]$/.test(prev)) s = '×' + s;
    setVal(prev + s + ta.value.slice(c), c + s.length);
  }
  function smartParen() {
    const prev = ta.value.slice(0, caret());
    const o = (prev.match(/\(/g) || []).length, cl = (prev.match(/\)/g) || []).length;
    insert(o > cl && /[\d.)πe!%²³]$/.test(prev) ? ')' : '(');
  }
  function del() {
    if (st.just) { st.just = false; }
    const v = ta.value, c = caret();
    if (c === 0) return;
    const prev = v.slice(0, c);
    let n = 1;
    for (const m of MULTI) if (prev.endsWith(m)) { n = m.length; break; }
    setVal(prev.slice(0, -n) + v.slice(c), c - n);
  }
  function clearAll() {
    st.just = false; st.editing = null; $('#editChip', body).hidden = true;
    setVal('');
  }
  function equals() {
    const v = ta.value;
    if (!v || st.just) return;
    let r;
    try { r = evalStr(v); } catch (e) { pv.textContent = e.message; pv.classList.add('err'); return; }
    const e = (v.match(/\(/g) || []).length - (v.match(/\)/g) || []).length;
    const expr = v + ')'.repeat(Math.max(0, e));
    if (st.editing) {
      const h = H.find(x => x.id === st.editing);
      if (h) { h.e = expr; h.r = r; h.t = Date.now(); }
      st.editing = null; $('#editChip', body).hidden = true;
      toast('Saved line updated');
    } else {
      H.push({ id: uid(), e: expr, r, t: Date.now() });
      if (H.length > 300) H.splice(0, H.length - 300);
    }
    S.ans = r; save();
    drawTape();
    setVal(fmtCalc(r, false));
    st.just = true; pv.textContent = '';
    ta.blur();
  }
  function loadEdit(id) {
    const h = H.find(x => x.id === id); if (!h) return;
    st.editing = id; st.just = false;
    $('#editChip', body).hidden = false;
    setVal(h.e);
    try { ta.focus({ preventScroll: true }); ta.setSelectionRange(h.e.length, h.e.length); } catch (e) { }
  }
  function memVal() {
    if (st.just) return S.ans;
    try { return ta.value ? evalStr(ta.value) : 0; } catch (e) { toast('Finish the sum first'); return null; }
  }
  const textBtn = $('#btnText', body);
  function textMode(on) {
    st.text = on;
    ta.setAttribute('inputmode', on ? 'text' : 'none');
    ta.setAttribute('autocapitalize', on ? 'words' : 'off');
    if (textBtn) textBtn.classList.toggle('on', on);
    if (on) {
      if (st.just) { st.just = false; setVal(''); }
      const c = caret(), prev = ta.value.slice(0, c);
      if (prev && !/\s$/.test(prev)) setVal(prev + ' ' + ta.value.slice(c), c + 1);
      ta.blur(); ta.focus();
      try { ta.setSelectionRange(st.caret, st.caret); } catch (e) { }
    }
  }
  if (textBtn) {
    textBtn.addEventListener('pointerdown', e => e.preventDefault());
    textBtn.onclick = () => textMode(!st.text);
  }
  function press(k) {
    if (st.text) { st.caret = ta.selectionStart; textMode(false); ta.blur(); }
    if (k.a === 'ac') return clearAll();
    if (k.a === 'del') return del();
    if (k.a === 'eq') return equals();
    if (k.a === 'paren') return smartParen();
    if (k.a === '2nd') { st.second = !st.second; drawKeys(); drawFlags(); return; }
    let txt;
    if (k.trig) {
      const h = st.hyp ? 'h' : '';
      txt = k.trig + h + (st.second ? '⁻¹' : '') + '(';
    } else if (st.second && k.si) txt = k.si;
    else txt = k.i || k.l;
    if (st.second && k.s) { st.second = false; drawKeys(); drawFlags(); }
    insert(txt);
  }

  keysEl.addEventListener('pointerdown', e => { if (e.target.closest('.key')) e.preventDefault(); });
  keysEl.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) press(keys[+b.dataset.i]); });
  if (sci) {
    const pills = $('#pills', body);
    pills.addEventListener('pointerdown', e => e.preventDefault());
    pills.addEventListener('click', e => {
      const p = e.target.closest('[data-p]'); if (!p) return;
      const a = p.dataset.p;
      if (a === 'angle') { S.angle = S.angle === 'deg' ? 'rad' : 'deg'; save(); preview(); }
      else if (a === 'hyp') { st.hyp = !st.hyp; drawKeys(); }
      else if (a === 'mc') { S.mem = 0; save(); toast('Memory cleared'); }
      else if (a === 'mr') { insertNumber(S.mem || 0); }
      else { const v = memVal(); if (v == null) return; S.mem = (S.mem || 0) + (a === 'm+' ? v : -v); save(); toast(`Memory: ${fmtCalc(S.mem)}`); }
      drawPills(); drawFlags();
    });
  }
  $('#tape', body).addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) loadEdit(b.dataset.id); });
  $('#editCancel', body).onclick = clearAll;
  ['click', 'keyup', 'select', 'blur'].forEach(ev => ta.addEventListener(ev, () => { st.caret = ta.selectionStart; }));
  ta.addEventListener('blur', () => { if (st.text) { st.text = false; ta.setAttribute('inputmode', 'none'); if (textBtn) textBtn.classList.remove('on'); } });
  ta.addEventListener('focus', () => { if (st.just) { st.just = false; } });
  ta.addEventListener('input', () => {
    const c = ta.selectionStart, v = ta.value;
    const nv = san(v), nc = san(v.slice(0, c)).length;
    if (nv !== v) { ta.value = nv; try { ta.setSelectionRange(nc, nc); } catch (e) { } }
    st.caret = nc; st.just = false; fit(); preview();
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); equals(); }
    else if (e.key === 'Escape') { e.preventDefault(); clearAll(); }
  });
  keyHandler = e => {
    const k = e.key;
    if (/^[0-9.]$/.test(k) || '+-*/^()%!'.includes(k)) { e.preventDefault(); insert(sanitize(k)); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
    else if (k === 'Backspace') { e.preventDefault(); del(); }
    else if (k === 'Escape') { e.preventDefault(); clearAll(); }
  };
  $('#btnClearScreen', body).addEventListener('pointerdown', e => e.preventDefault());
  $('#btnClearScreen', body).onclick = () => {
    S.tapeCut = S.tapeCut || {};
    S.tapeCut[cid] = Date.now(); save();
    clearAll(); drawTape();
    toast('Screen cleared. Full history is still saved.');
  };
  $('#btnCopy', body).onclick = () => {
    const v = ta.value;
    if (!v) return toast('Nothing to copy yet');
    let r = null;
    try { r = evalStr(v); } catch (e) { }
    if (r != null) copyText(rawCalc(r), 'Copied ' + rawCalc(r)); else copyText(v, 'Copied the sum');
  };
  $('#btnPaste', body).onclick = () => {
    const fail = () => toast('Long-press the display, then tap Paste');
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) return fail();
      navigator.clipboard.readText().then(t => {
        const s = san(t || '').trim();
        if (!s) return toast('Clipboard is empty');
        if (st.just) { st.just = false; setVal(''); }
        const c = caret();
        setVal(ta.value.slice(0, c) + s + ta.value.slice(c), c + s.length);
      }, fail);
    } catch (e) { fail(); }
  };

  const noteTa = $('#noteTa', body);
  let noteCaret = null;
  noteTa.value = S.note || '';
  noteTa.addEventListener('input', () => { S.note = noteTa.value; save(); });
  ['click', 'keyup', 'blur'].forEach(ev => noteTa.addEventListener(ev, () => { noteCaret = noteTa.selectionStart; }));
  function currentResult() {
    if (st.just) return S.ans;
    try { if (ta.value) return evalStr(ta.value); } catch (e) { }
    return H.length ? H[H.length - 1].r : null;
  }
  function noteAdd(text, ownLine) {
    const v = noteTa.value;
    let pos = noteTa.ownerDocument.activeElement === noteTa ? noteTa.selectionStart : noteCaret;
    if (pos == null || pos > v.length) pos = v.length;
    const pre = v.slice(0, pos), post = v.slice(pos);
    let add = text;
    if (ownLine) { if (pre && !pre.endsWith('\n')) add = '\n' + add; add += '\n'; }
    else if (pre && !/\s$/.test(pre)) add = ' ' + add;
    noteTa.value = pre + add + post; noteCaret = pre.length + add.length;
    S.note = noteTa.value; save();
    noteTa.scrollTop = noteTa.scrollHeight;
  }
  let noteClearArm = 0;
  $('.nbar', body).addEventListener('click', e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    const a = b.dataset.n;
    if (a === 'res') { const r = currentResult(); if (r == null) return toast('No result yet'); noteAdd(fmtCalc(r)); toast('Result added to note'); }
    else if (a === 'line') {
      let line = null;
      if (st.just && H.length) { const h = H[H.length - 1]; line = `${h.e} = ${fmtCalc(h.r)}`; }
      else if (ta.value) { try { line = `${ta.value} = ${fmtCalc(evalStr(ta.value))}`; } catch (e) { } }
      else if (H.length) { const h = H[H.length - 1]; line = `${h.e} = ${fmtCalc(h.r)}`; }
      if (!line) return toast('Finish the sum first');
      noteAdd(line, true); toast('Line added to note');
    }
    else if (a === 'copy') { if (!noteTa.value.trim()) return toast('The note is empty'); copyText(noteTa.value, 'Note copied'); }
    else if (a === 'clear') {
      if (!noteTa.value) return;
      if (Date.now() - noteClearArm > 3000) { noteClearArm = Date.now(); b.textContent = 'Tap again'; setTimeout(() => b.textContent = 'Clear', 3000); return; }
      noteTa.value = ''; S.note = ''; save(); b.textContent = 'Clear';
    }
  });

  function historySheet() {
    const draw = () => {
      if (!H.length) return `<p class="hempty">No calculations yet. Press = to save one here.</p>`;
      return `<div class="btn-row"><button class="btn" type="button" data-all="copy">${I.copy}Copy all</button><button class="btn danger" type="button" data-all="clear">Clear all</button></div>
      <div>${H.slice().reverse().map(h => `<div class="hitem" data-id="${h.id}">
        <button type="button" class="hmain" data-act="toggle"><span class="he">${esc(h.e)}</span><span class="hr">= ${fmtCalc(h.r)}</span><span class="ht">${timeStr(h.t)}</span></button>
        <div class="hacts" hidden>
          <button class="btn pri" type="button" data-act="edit">${I.pencil}Edit</button>
          <button class="btn" type="button" data-act="use">Use result</button>
          <button class="btn" type="button" data-act="copy">${I.copy}Result</button>
          <button class="btn" type="button" data-act="line">${I.copy}Whole line</button>
          <button class="btn danger" type="button" data-act="del">Delete</button>
        </div></div>`).join('')}</div>`;
    };
    openSheet(`History (${H.length})`, draw(), b => {
      let clearArm = 0;
      b.onclick = e => {
        const t = e.target.closest('button'); if (!t) return;
        if (t.dataset.all === 'copy') return copyText(H.map(h => `${h.e} = ${rawCalc(h.r)}`).join('\n'), `Copied ${H.length} lines`);
        if (t.dataset.all === 'clear') {
          if (Date.now() - clearArm > 3000) { clearArm = Date.now(); t.textContent = 'Tap again to clear'; return; }
          H.splice(0); save(); drawTape(); b.innerHTML = draw(); $('#sheetTitle').textContent = 'History (0)'; return;
        }
        const item = t.closest('.hitem'); if (!item) return;
        const h = H.find(x => x.id === item.dataset.id); if (!h) return;
        const act = t.dataset.act;
        if (act === 'toggle') { const a = $('.hacts', item); const open = a.hidden; $$('.hacts', b).forEach(x => x.hidden = true); a.hidden = !open; }
        else if (act === 'edit') { closeSheet(); loadEdit(h.id); }
        else if (act === 'use') { closeSheet(); insertNumber(h.r); }
        else if (act === 'copy') copyText(rawCalc(h.r), 'Copied ' + rawCalc(h.r));
        else if (act === 'line') copyText(`${h.e} = ${rawCalc(h.r)}`, 'Copied the line');
        else if (act === 'del') {
          H.splice(H.indexOf(h), 1); save(); item.remove(); drawTape();
          if (st.editing === h.id) clearAll();
          $('#sheetTitle').textContent = `History (${H.length})`;
          if (!H.length) b.innerHTML = draw();
        }
      };
    });
  }

  drawKeys(); drawPills(); drawTape(); setVal('');
}

/* ---------- form helpers ---------- */
const inputs = cid => S.inputs[cid] || (S.inputs[cid] = {});
let F = null; // current form calc id
const gv = (k, d) => { const v = inputs(F)[k]; return v == null ? d : v; };
const nf = (k, label, def, o = {}) => `<label class="fld ${o.cls || ''}" ${o.id ? `id="${o.id}"` : ''}><span class="fl">${label}</span><span class="fi">${o.pre ? `<b class="aff">${o.pre}</b>` : ''}<input data-k="${k}" type="text" inputmode="decimal" autocomplete="off" value="${esc(gv(k, def))}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>${o.suf ? `<b class="aff">${o.suf}</b>` : ''}</span></label>`;
const sf = (k, label, opts, def, o = {}) => `<label class="fld" ${o.id ? `id="${o.id}"` : ''}><span class="fl">${label}</span><span class="fi sel"><select data-k="${k}">${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(gv(k, def)) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></span></label>`;
const df = (k, label, def, o = {}) => `<label class="fld" ${o.id ? `id="${o.id}"` : ''}><span class="fl">${label}</span><span class="fi"><input data-k="${k}" type="date" value="${esc(k.startsWith('t_') ? def : gv(k, def))}"></span></label>`;
const seg = (k, opts, def) => `<div class="seg" data-seg="${k}">${opts.map(([v, l]) => `<button type="button" data-val="${v}" class="${String(v) === String(gv(k, def)) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const chips = (k, vals, suf = '') => `<div class="chips" data-chips="${k}">${vals.map(v => `<button type="button" data-v="${v}">${v}${suf}</button>`).join('')}</div>`;
const panel = (title, inner, o = {}) => `<section class="panel" ${o.id ? `id="${o.id}"` : ''}${o.hidden ? ' hidden' : ''}>${title ? `<h3>${title}</h3>` : ''}${inner}</section>`;
const ires = (label, value, copy) => `<div class="ires"><div><div class="il">${label}</div><div class="iv">${value}</div></div>${cpBtn(copy)}</div>`;
const res = (label, value, copy, cls = '') => `<div class="res"><span class="rl">${label}</span><span class="rv ${cls}">${value}</span>${cpBtn(copy)}</div>`;

function mountForm(cid, body, html, compute, o = {}) {
  F = cid;
  body.innerHTML = `<div class="form">${html}</div>`;
  const read = () => {
    const v = {};
    $$('[data-k]', body).forEach(el => { v[el.dataset.k] = el.value; });
    $$('[data-seg]', body).forEach(sg => { const on = $('.on', sg); if (on) v[sg.dataset.seg] = on.dataset.val; });
    return v;
  };
  const syncChips = () => $$('[data-chips]', body).forEach(ch => {
    const inp = $(`[data-k="${ch.dataset.chips}"]`, body);
    $$('button', ch).forEach(b => b.classList.toggle('on', inp && num(inp.value) === +b.dataset.v));
  });
  const run = () => {
    const v = read();
    const store = inputs(cid);
    for (const k in v) if (!k.startsWith('t_')) store[k] = v[k];
    save(); syncChips();
    compute(v, body);
  };
  body.oninput = e => { if (o.onInput && o.onInput(e) === false) return; run(); };
  body.onchange = run;
  body.onclick = e => {
    const sb = e.target.closest('[data-seg] button');
    if (sb) { $$('button', sb.parentElement).forEach(b => b.classList.toggle('on', b === sb)); run(); return; }
    const cb = e.target.closest('[data-chips] button');
    if (cb) { const inp = $(`[data-k="${cb.parentElement.dataset.chips}"]`, body); if (inp) { inp.value = cb.dataset.v; run(); } return; }
    if (o.onClick) o.onClick(e, run);
  };
  addAction(`<button class="icon-btn" type="button" aria-label="Reset this calculator">${I.reset}</button>`, () => {
    delete S.inputs[cid]; save(); openCalc(cid, false); toast('Reset to example values');
  });
  run();
}

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
function ymd(a, b) {
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}
const plural = (n, w) => `${nf2(n, 0)} ${w}${n === 1 ? '' : 's'}`;

      onClick(e, run) {
        const t = e.target.closest('button'); if (!t) return;
        if (t.id === 'swap') { const f = $('[data-k="from"]', b), to = $('[data-k="to"]', b); [f.value, to.value] = [to.value, f.value]; run(); }
        if (t.id === 'rEdit') { editingOthers = !editingOthers; drawRates(); t.innerHTML = editingOthers ? `${I.check}Done` : `${I.pencil}Edit other rates`; }
        if (t.id === 'rReset') { S.rates = null; S.ratesDate = ''; save(); drawRates(); run(); toast('Sample rates restored'); }
        if (t.id === 'rFetch') {
          t.disabled = true; t.textContent = 'Updating…';
          fetch('https://open.er-api.com/v6/latest/BDT').then(r => r.json()).then(d => {
            if (!d || !d.rates) throw 0;
            const R = rates(); CURRENCIES.forEach(c => { if (d.rates[c[0]]) R[c[0]] = +(1 / d.rates[c[0]]).toPrecision(6); });
            S.ratesDate = 'updated online on ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); save();
            drawRates(); run(); toast('Rates updated');
          }).catch(() => toast("Couldn't reach the rate service. Check your internet, or type the rates yourself.")).finally(() => { t.disabled = false; t.innerHTML = `${I.cloud}Update online`; });
        }
      },
    });
  },

  emi(b) {
    F = 'emi';
    mountForm('emi', b, `
      ${panel('Loan', `${nf('p', 'Loan amount', '500000', { pre: esc(S.cur) })}<div class="row2">${nf('r', 'Interest per year', '9', { suf: '%' })}${nf('n', 'Tenure', '5')}</div>${seg('unit', [['y', 'Years'], ['m', 'Months']], 'y')}`)}
      ${panel('Summary', '<div id="out"></div>')}
      ${panel('Year by year', '<div class="tbl-wrap" id="tbl"></div>')}`, (v, body) => {
      const P = num(v.p), R = num(v.r) || 0, N0 = num(v.n);
      if (!P || !N0) { setBar('Monthly EMI', '—'); $('#out', body).innerHTML = ''; $('#tbl', body).innerHTML = ''; return; }
      const n = Math.max(1, Math.round(v.unit === 'm' ? N0 : N0 * 12)), r = R / 1200;
      const emi = r ? P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : P / n;
      const total = emi * n, int = total - P, pi = P / total * 100;
      setBar('Monthly EMI', money(emi), plain(emi, 2), `${n} months · total interest ${money(int, 0)}`);
      $('#out', body).innerHTML = res('Monthly EMI', money(emi), plain(emi, 2)) + res('Total interest', money(int), plain(int, 2), 'bad') + res('Total payment', money(total), plain(total, 2)) + res('Number of months', String(n)) +
        `<div class="split" style="margin-top:6px"><i style="width:${pi}%;background:var(--eq)"></i><i style="width:${100 - pi}%;background:var(--op)"></i></div>
        <div class="legend"><span><i style="background:var(--eq)"></i>Principal ${nf2(pi, 1)}%</span><span><i style="background:var(--op)"></i>Interest ${nf2(100 - pi, 1)}%</span></div>`;
      let bal = P, rows = '', yp = 0, yi = 0;
      for (let m = 1; m <= n; m++) {
        const ii = bal * r, pp = emi - ii; bal = Math.max(0, bal - pp); yp += pp; yi += ii;
        if (m % 12 === 0 || m === n) { rows += `<tr><td>Year ${Math.ceil(m / 12)}</td><td>${nf2(yp, 0)}</td><td>${nf2(yi, 0)}</td><td>${nf2(bal, 0)}</td></tr>`; yp = yi = 0; }
        if (m > 600) break;
      }
      $('#tbl', body).innerHTML = `<table class="tbl"><thead><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
    });
  },

  interest(b) {
    F = 'interest';
    mountForm('interest', b, `
      ${panel('', seg('mode', [['c', 'Compound'], ['s', 'Simple']], 'c'))}
      ${panel('Deposit', `${nf('p', 'Principal', '100000', { pre: esc(S.cur) })}<div class="row2">${nf('r', 'Rate per year', '8', { suf: '%' })}${nf('t', 'Time', '5', { suf: 'years' })}</div>
        ${sf('f', 'Compounded', [['1', 'Yearly'], ['2', 'Half-yearly'], ['4', 'Quarterly'], ['12', 'Monthly'], ['365', 'Daily']], '12', { id: 'fFreq' })}`)}
      ${panel('Result', '<div id="out"></div>')}
      ${panel('Growth by year', '<div class="tbl-wrap" id="tbl"></div>', { id: 'pTbl' })}`, (v, body) => {
      const P = num(v.p), R = num(v.r) || 0, t = num(v.t), comp = v.mode !== 's', f = +v.f || 12;
      $('#fFreq', body).hidden = !comp;
      if (!P || t == null) { setBar('Maturity amount', '—'); $('#out', body).innerHTML = ''; $('#tbl', body).innerHTML = ''; return; }
      const amt = y => comp ? P * Math.pow(1 + R / 100 / f, f * y) : P * (1 + R / 100 * y);
      const A = amt(t), I0 = A - P;
      setBar('Maturity amount', money(A), plain(A, 2), `Interest earned ${money(I0)}`);
      $('#out', body).innerHTML = res('Principal', money(P)) + res('Interest earned', money(I0), plain(I0, 2), 'good') + res('Maturity amount', money(A), plain(A, 2)) +
        (comp ? res('Effective yearly rate', nf2((Math.pow(1 + R / 100 / f, f) - 1) * 100, 3) + '%') : res('Interest per year', money(P * R / 100)));
      let rows = '';
      for (let y = 1; y <= Math.min(Math.ceil(t), 50); y++) { const yy = Math.min(y, t), a = amt(yy); rows += `<tr><td>Year ${nf2(yy, 2)}</td><td>${nf2(a - P, 0)}</td><td>${nf2(a, 0)}</td></tr>`; }
      $('#tbl', body).innerHTML = `<table class="tbl"><thead><tr><th>Year</th><th>Interest</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
    });
  },

  profit(b) {
    F = 'profit';
    mountForm('profit', b, `
      ${panel('', seg('mode', [['check', 'Check profit'], ['price', 'Set a price']], 'check'))}
      ${panel('Cost and price', `<div class="row2">${nf('cost', 'Cost price', '800', { pre: esc(S.cur) })}${nf('sell', 'Selling price', '1200', { pre: esc(S.cur) })}</div>${nf('qty', 'Quantity', '1')}`, { id: 'pCheck' })}
      ${panel('Target', `${nf('cost2', 'Cost price', '800', { pre: esc(S.cur) })}<div class="row2">${nf('pct', 'Target', '30', { suf: '%' })}${seg('basis', [['margin', 'Margin'], ['markup', 'Markup']], 'margin')}</div>`, { id: 'pPrice' })}
      ${panel('Result', '<div id="out"></div><p class="note" style="padding-top:8px">Margin is profit as a share of the selling price. Markup is profit as a share of the cost.</p>')}`, (v, body) => {
      const check = v.mode !== 'price';
      $('#pCheck', body).hidden = !check; $('#pPrice', body).hidden = check;
      const out = $('#out', body);
      if (check) {
        const c = num(v.cost), s = num(v.sell), q = num(v.qty) || 1;
        if (c == null || s == null) { setBar('Profit', '—'); out.innerHTML = ''; return; }
        const p = s - c, gain = p >= 0;
        setBar(gain ? 'Profit' : 'Loss', money(Math.abs(p * q)), plain(p * q, 2), s ? `Margin ${nf2(p / s * 100, 2)}% · markup ${c ? nf2(p / c * 100, 2) + '%' : '—'}` : '');
        out.innerHTML = res(gain ? 'Profit per item' : 'Loss per item', money(Math.abs(p)), plain(p, 2), gain ? 'good' : 'bad') + (q > 1 ? res(`Total for ${nf2(q, 0)}`, money(p * q), plain(p * q, 2), gain ? 'good' : 'bad') : '') +
          res('Margin', s ? nf2(p / s * 100, 2) + '%' : '—') + res('Markup', c ? nf2(p / c * 100, 2) + '%' : '—') + res('Total sales', money(s * q)) + res('Total cost', money(c * q));
      } else {
        const c = num(v.cost2), t = num(v.pct);
        if (c == null || t == null) { setBar('Selling price', '—'); out.innerHTML = ''; return; }
        if (v.basis === 'margin' && t >= 100) { setBar('Selling price', '—'); out.innerHTML = '<p class="note bad">Margin must be below 100%.</p>'; return; }
        const s = v.basis === 'margin' ? c / (1 - t / 100) : c * (1 + t / 100), p = s - c;
        setBar('Selling price', money(s), plain(s, 2), `Profit ${money(p)} per item`);
        out.innerHTML = res('Selling price', money(s), plain(s, 2)) + res('Profit per item', money(p), plain(p, 2), 'good') + res('Margin', nf2(p / s * 100, 2) + '%') + res('Markup', c ? nf2(p / c * 100, 2) + '%' : '—');
      }
    });
  },

  land(b) {
    F = 'land';
    mountForm('land', b, `
      ${panel('Area', `<div class="row2">${nf('val', 'Value', '10')}${sf('from', 'Unit', LAND.map(u => [u[0], u[1]]), 'dec')}</div>`)}
      ${panel('In every unit', '<div id="out"></div><p class="note">1 decimal = 435.6 sq ft · 1 katha = 720 sq ft · 1 bigha = 20 katha · 1 acre = 100 decimal. Some districts use different local measures.</p>')}`, (v, body) => {
      const x = num(v.val);
      if (x == null) { setBar('Area', '—'); $('#out', body).innerHTML = ''; return; }
      const f = LAND.find(u => u[0] === v.from) || LAND[4], sqft = x * f[2];
      setBar(`${nf2(x, 4)} ${f[1].replace(' (shotangsho)', '')} =`, `${nf2(sqft, 2)} sq ft`, plain(sqft, 4), `${nf2(sqft / 720, 3)} katha · ${nf2(sqft / 435.6, 3)} decimal`);
      $('#out', body).innerHTML = convList(LAND, x, v.from, n => nf2(n, 4));
    });
  },

  gold(b) {
    F = 'gold';
    mountForm('gold', b, `
      ${panel('Weight', `<div class="row2">${nf('w', 'Weight', '1')}${sf('u', 'Unit', GOLD.map(u => [u[0], u[1]]), 'bhori')}</div>`)}
      ${panel('Value (optional)', `${nf('price', 'Price per bhori', '', { pre: esc(S.cur), ph: 'your jeweller’s rate' })}${nf('make', 'Making charge', '', { suf: '%', ph: '0' })}`)}
      ${panel('In every unit', '<div id="out"></div><p class="note">1 bhori = 11.664 g = 16 ana · 1 ana = 6 rati · 1 rati = 10 point.</p>')}`, (v, body) => {
      const w = num(v.w);
      if (w == null) { setBar('Weight', '—'); $('#out', body).innerHTML = ''; return; }
      const f = GOLD.find(u => u[0] === v.u) || GOLD[1], g = w * f[2];
      let pts = Math.round(g / .01215 * 100) / 100;
      const bh = Math.floor(pts / 960); pts -= bh * 960;
      const an = Math.floor(pts / 60); pts -= an * 60;
      const ra = Math.floor(pts / 10); pts -= ra * 10;
      const parts = [bh && `${bh} bhori`, an && `${an} ana`, ra && `${ra} rati`, pts && `${nf2(pts, 1)} point`].filter(Boolean).join(' ') || '0';
      const price = num(v.price), mk = num(v.make) || 0;
      if (price) {
        const val = g / 11.664 * price, total = val * (1 + mk / 100);
        setBar('Gold value', money(total, 0), plain(total, 0), `${nf2(g, 3)} g · ${parts}`);
      } else setBar('Weight in grams', `${nf2(g, 3)} g`, plain(g, 4), parts);
      $('#out', body).innerHTML = res('Traditional', parts, parts) +
        (price ? res('Gold value', money(g / 11.664 * price, 0), plain(g / 11.664 * price, 0)) + (mk ? res(`Making charge ${nf2(mk, 2)}%`, money(g / 11.664 * price * mk / 100, 0)) : '') + res('Price per gram', money(price / 11.664)) : '') +
        convList(GOLD, w, v.u, n => nf2(n, 4));
    });
  },
};

/* ---------- start ---------- */
applyTheme();
applyFonts();
renderGrid();
try { history.replaceState({ home: 1 }, ''); } catch (e) { }
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
